name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: chunklens
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            bin: chunklens
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            bin: chunklens
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: chunklens
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: chunklens.exe
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release artifact (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="chunklens-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGING/"
          cp README.md "$STAGING/"
          tar -czf "${STAGING}.tar.gz" "$STAGING"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          else
            shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"
          fi
          echo "ASSET=${STAGING}.tar.gz" >> $GITHUB_ENV
          echo "CHECKSUM=${STAGING}.tar.gz.sha256" >> $GITHUB_ENV

      - name: Package release artifact (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="chunklens-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$STAGING/"
          cp README.md "$STAGING/"
          7z a -tzip "${STAGING}.zip" "./$STAGING/*"
          sha256sum "${STAGING}.zip" > "${STAGING}.zip.sha256"
          echo "ASSET=${STAGING}.zip" >> $GITHUB_ENV
          echo "CHECKSUM=${STAGING}.zip.sha256" >> $GITHUB_ENV

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true
