[package]
name = "chunklens"
version = "0.1.0"
edition = "2024"
description = "Fast, read-only Minecraft Anvil world analyzer"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
fastnbt = "2.6"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
indicatif = { version = "0.18", features = ["rayon"] }
lz4_flex = "0.11"
rayon = "1.10"
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
ratatui = "0.30"
crossterm = "0.29"
base64 = "0.22"
mimalloc = { version = "0.1", default-features = false }
tempfile = "3.15"
rpassword = "7"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
prost = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
