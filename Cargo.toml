[package]
name = "chunklens"
version = "0.1.0"
edition = "2024"
authors = ["Sqrilizz"]
description = "High-throughput Minecraft Anvil & Linear region scanner, split-screen TUI lag investigator, Spark correlator, and config auditor"
repository = "https://github.com/Sqrilizz/chunklens"
readme = "README.md"
keywords = ["minecraft", "anvil", "linear", "tui", "profiler"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
fastnbt = "2.6"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
indicatif = { version = "0.18", features = ["rayon"] }
lz4_flex = "0.14"
rayon = "1.10"
rustyline = "18.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
ratatui = "0.30"
crossterm = "0.29"
base64 = "0.23"
mimalloc = { version = "0.1", default-features = false }
tempfile = "3.15"
rpassword = "7"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
prost = "0.14"
libdeflater = "1.26.1"
notify = "8.2.0"
zstd = "0.14.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
